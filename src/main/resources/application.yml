spring:
  application:
    name: giftly

  # DataSource Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/giftly
    username: ledan
    password: 1234
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true

  # Flyway Migration Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # MVC - throw exception for unmapped URLs so GlobalExceptionHandler can catch 404
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# JWT Configuration
jwt:
  secret: MySecretKey123456789012345678901234567890123456789012345678901234567890
  access-token:
    expiration: 3600000
  refresh-token:
    expiration: 604800000

# Cloudinary Configuration
cloudinary:
  cloud-name: dhbl9cnwm
