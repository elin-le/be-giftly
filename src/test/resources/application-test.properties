# Test profile configuration
# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests
spring.flyway.enabled=false

# JWT Configuration (test secret)
jwt.secret=TestSecretKeyForUnitTesting12345678901234567890123456789012345678901234567890
jwt.access-token.expiration=3600000
jwt.refresh-token.expiration=604800000

# Cloudinary (mocked in tests)
cloudinary.cloud-name=test-cloud-name
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

# Admin config
admin.default.email=admin@test.com
admin.default.password=AdminTest123
admin.default.full-name=Test Admin
admin.default.phone=0123456789
admin.secret-code=test123

# MVC
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
